name: Check Home Runs

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes
  workflow_dispatch:         # allows manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore tweeted state
        uses: actions/cache@v4
        with:
          path: tweeted.json
          key: tweeted-${{ github.run_id }}
          restore-keys: tweeted-

      - name: Install dependencies
        run: npm ci && pip install twikit

      - name: Check for home runs
        env:
          BSKY_HANDLE:        ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD:  ${{ secrets.BSKY_APP_PASSWORD }}
        run: node runner.js

      - name: Post to Twitter
        if: ${{ secrets.TWITTER_COOKIES != '' }}
        env:
          TWITTER_COOKIES:  ${{ secrets.TWITTER_COOKIES }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_EMAIL:    ${{ secrets.TWITTER_EMAIL }}
          TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
        run: python post_tweet.py
