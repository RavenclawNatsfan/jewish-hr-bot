name: Check Home Runs

on:
  schedule:
    - cron: '*/15 * * * *'  # kicks off a watch loop (GitHub may delay/skip these)
  workflow_dispatch:          # allows manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

# Only one watch loop runs at a time. If a scheduled trigger fires while one
# is already running, it queues and starts immediately after the current one
# ends — this is what gives us continuous coverage despite GitHub's unreliable
# high-frequency cron scheduling.
concurrency:
  group: check-hrs-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Watch for home runs
        env:
          BSKY_HANDLE:        ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD:  ${{ secrets.BSKY_APP_PASSWORD }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          end=$((SECONDS + 340 * 60))
          while [ $SECONDS -lt $end ]; do
            node runner.js || echo "runner.js failed, will retry"
            node email.js || echo "email.js failed, will retry"

            if ! git diff --quiet -- tweeted.json; then
              git add tweeted.json
              git commit -q -m "Update posted HR state"
              git fetch -q origin main
              git rebase -q origin/main
              git push -q origin HEAD:main
            fi

            sleep 60
          done
