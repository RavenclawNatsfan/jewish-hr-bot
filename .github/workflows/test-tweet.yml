name: Test Post

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Send test post
        env:
          BSKY_HANDLE:       ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          node -e "
          const { sendPost, formatPost } = require('./bluesky');
          const text = formatPost({
            playerName: 'Joc Pederson',
            careerHRs: 187,
            rbi: 2,
            awayScore: 3, homeScore: 5,
            distance: 401, exitVelo: 107.2, launchAngle: 31,
            inning: 9, halfInning: 'bottom',
            homeTeam: 'TEX', awayTeam: 'KC',
            isMiLB: false, level: null,
          });
          console.log('Posting:\n' + text);
          sendPost(text).then(() => console.log('Success!')).catch(e => { console.error(e.message); process.exit(1); });
          "
