name: Test Tweet

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Send test tweet
        env:
          TWITTER_API_KEY:       ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:    ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:  ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: |
          node -e "
          const { sendTweet, formatTweet } = require('./twitter');
          const text = formatTweet({
            playerName: 'Joc Pederson',
            distance: null, exitVelo: null, launchAngle: null,
            inning: 9, halfInning: 'bottom',
            homeTeam: 'TEX', awayTeam: 'KC',
            level: null,
          });
          console.log('Sending:\n' + text);
          sendTweet(text).then(() => console.log('Success!')).catch(e => { console.error(e.message); process.exit(1); });
          "
