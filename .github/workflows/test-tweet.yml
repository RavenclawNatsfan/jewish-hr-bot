name: Test Post

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Send test post
        env:
          BSKY_HANDLE:       ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          node -e "
          const { sendPost, formatPost } = require('./bluesky');
          const text = formatPost({
            playerName: 'Joc Pederson',
            careerHRs: 226,
            rbi: 1,
            awayScore: 0, homeScore: 9,
            distance: 339, exitVelo: 96.2, launchAngle: 23,
            inning: 6, halfInning: 'bottom',
            homeTeam: 'TEX', awayTeam: 'KC',
            isMiLB: false, level: null,
          });
          console.log('Posting:\n' + text);
          sendPost(text).then(() => console.log('Success!')).catch(e => { console.error(e.message); process.exit(1); });
          "
